</style></head> <body data-astro-cid-5hce7sga> <header class="nav" data-astro-cid-5hce7sga> <div class="wrap nav-in" data-astro-cid-5hce7sga> <a class="brand" href="/website/" data-astro-cid-5hce7sga>Helix</a> <nav data-astro-cid-5hce7sga><a href="/website/#projects" data-astro-cid-5hce7sga>项目</a><a href="/website/#experience" data-astro-cid-5hce7sga>经历</a><a href="/website/writing/" data-astro-cid-5hce7sga>文章</a><a href="/website/#contact" data-astro-cid-5hce7sga>联系</a><a href="/website/console/" data-astro-cid-5hce7sga>中控</a></nav> </div> </header>  <main class="ask wrap" data-astro-cid-tie5jllb> <section class="intro" data-astro-cid-tie5jllb> <p class="eyebrow" data-astro-cid-tie5jllb>数字分身 · 离线演示</p> <h1 data-astro-cid-tie5jllb>想了解我，直接问</h1> <p class="lead" data-astro-cid-tie5jllb>这是用我的个人知识库做的数字分身：只回答公开的经历、项目和能力，答不了的会让你直接找我本人。</p> </section> <section class="chat panel" aria-live="polite" data-astro-cid-tie5jllb> <div id="log" class="log" data-astro-cid-tie5jllb> <div class="msg bot" data-astro-cid-tie5jllb><div class="msg-inner" data-astro-cid-tie5jllb><div class="bubble" data-astro-cid-tie5jllb>你好，我是 Helix 的数字分身。可以问我的经历、做过的项目，或者怎么合作。</div></div></div> </div> <div class="chips" data-astro-cid-tie5jllb><button type="button" class="chip" data-astro-cid-tie5jllb>你是做什么的？</button><button type="button" class="chip" data-astro-cid-tie5jllb>讲讲你做过的 FDE 项目</button><button type="button" class="chip" data-astro-cid-tie5jllb>你在律所做过什么？</button><button type="button" class="chip" data-astro-cid-tie5jllb>多 Agent 调度中枢怎么运作？</button><button type="button" class="chip" data-astro-cid-tie5jllb>怎么联系你？</button></div> <form id="f" class="input" data-astro-cid-tie5jllb> <input id="q" autocomplete="off" maxlength="200" placeholder="输入问题，比如：你适合什么岗位？" aria-label="输入要问数字分身的问题" data-astro-cid-tie5jllb> <button type="submit" data-astro-cid-tie5jllb>发送</button> </form> </section> <p class="note" data-astro-cid-tie5jllb>当前为离线演示：从公开资料中检索作答，不调用模型。</p> </main> <script id="twin-data" type="application/json">{"chunks":[{"id":"who","title":"我是谁","text":"Helix，法律 × AI · Agent FDE。法考客观题已通过。在律所跟执行主任上门拜访过 90+ 家客户，知道案源从哪来、咨询怎么变成签约；也能把业务流程拆成「上下文 → 数据库 → Agent → 自动化」，独立交付给客户。正在找 Agent FDE（驻场部署工程师：到客户现场把 AI 落地）和法律 × AI 方向的工作，base 深圳。","keys":["你是谁","介绍","自我介绍","背景","定位","求职","岗位","深圳"]},{"id":"contact","title":"怎么联系","text":"邮箱 p971523047@gmail.com，base 深圳。电话等招聘方需要时再提供。","keys":["联系","邮箱","电话","微信","面试","合作","约"]},{"id":"skills","title":"能力","text":"法律业务：6 个月律所一线谈案，90+ 家客户、熟悉律师业务推广合规红线、劳动、婚姻家事、民间借贷、合同、交通事故等常见咨询。AI 与 Agent 编排：多 Agent 系统设计与长期运行、Claude Code / Codex / DeepSeek 重度实操、把规则拆成 AI 判断逻辑，Skill 包化交付。FDE 式交付：需求澄清：电话 + 现场面谈、方案收敛 → 原型 → 交付文档、客户自安装说明，有付费复购","keys":["能力","技能","擅长","会什么","优势"]},{"id":"p-law-film","title":"法律 × AI 概念片","text":"法律 × AI 概念片：一个人用 AI 做完的 15 秒概念片：从选方向、分镜、关键帧到图生视频与合成，全程可追溯。 问题：律所想用短视频讲清专业形象，外包贵、周期长，AI 直接生成又容易廉价、乱码。 做法：先拆参考片节奏，再迭代分镜和关键帧，做模型 A/B 选画风；先用静帧剪出全片确认，再花钱生成视频；字幕中英双语、网页叠加可开关。 结果：Wan 3.0 正片 + 11 步制作链路完整公开","keys":["法律 × AI 概念片","AI 视频","流程设计","双语"]},{"id":"p-enterprise-context","title":"企业 AI 上下文系统","text":"企业 AI 上下文系统：FDE 实操：给佛山一家约 8 人的制造外贸企业做 AI 落地，从需求澄清到现场推进。 问题：客户只知道「想用 AI 做内容获客」，不知道从哪一步开始，企业资料也散在各处。 做法：需求表加 5 分钟电话澄清，把诉求收敛成三步：企业上下文 → 单点自动化 → 可复用 Skill；2026 年 9 月赴佛山南海现场面谈，推进知识库 MVP。 结果：独立交付，进行中","keys":["企业 AI 上下文系统","FDE","需求澄清","知识库"]},{"id":"p-tw-stock-script","title":"台股群聊剧本生成器","text":"台股群聊剧本生成器：付费客户项目：给投教社群生成群聊剧本，客户自己就能运行。 问题：社群每天要产出大量带行情的群聊内容，人工写慢，AI 直接写又容易编数据。 做法：交付 Skill 包：规则层 + 5 张场景卡 + 31 张角色卡 + 行情抓取与自检脚本 + 自安装说明；用单一事实源驱动，硬性规定「抓取失败不得编造数据」。 结果：客户复购，追加韩股版本","keys":["台股群聊剧本生成器","Skill 包","防幻觉","付费交付"]},{"id":"p-dsh","title":"DSH 多 Agent 调度中枢","text":"DSH 多 Agent 调度中枢：Claude Code 做规划和验收，便宜模型做执行，统一调度多个 AI 桌面工具。 问题：同时用多个 AI 工具，任务和上下文分散，成本也难控制。 做法：用文件契约（任务单 → runs/ → 验收）交接每一步，全程可追溯；决策日志只追加不删改，密钥只走环境变量。 结果：已跑通端到端闭环","keys":["DSH 多 Agent 调度中枢","多 Agent","编排","成本控制"]},{"id":"p-digital-twin","title":"数字分身","text":"数字分身：用个人知识库「蒸馏」自己：访客在网页上直接提问，分身按我的真实资料作答。 问题：招聘方和客户想快速了解一个人，翻简历慢，很多问题又不值得专门约一次电话。 做法：个人数据库只导出公开层作为知识库，接 DeepSeek 实时问答；限定只谈职业信息、资料外的不猜，密钥放在服务端代理，不进前端。 结果：这个网站上就能直接和它对话","keys":["数字分身","知识库","Agent","实时问答"]},{"id":"p-market-watch","title":"自动看盘与风控信号","text":"自动看盘与风控信号：个人验证项目：常驻进程 7×24 盯盘，趋势反转时分三级发出减仓 / 平仓信号。 问题：人不可能整夜盯盘，等看到行情时往往已经错过最佳离场点。 做法：后端常驻订阅行情，规则可解释（实体、突破、量能三条同时满足才算趋势阳线），先在历史数据上回测再上线；只发信号、不碰资金。 结果：BTC 近 90 天回放：2160 根 K 线，44 个信号","keys":["自动看盘与风控信号","实时监控","规则引擎","回测"]},{"id":"p-ecommerce-reply","title":"AI 工具服务：从上架到成交","text":"AI 工具服务：从上架到成交：个人实战：把自己做的 AI 自动化工具和部署服务挂上闲鱼，自己引流、自己成交、自己交付。 问题：做出好用的小工具不难，难的是证明有人愿意付钱：找到客户、讲清价值、交付到位。 做法：把能力拆成标准化服务（AI 工具部署到上门 FDE 部署，最高 ¥8000 档）；标题和详情页做关键词引流，AI 自动回复 7×24 接咨询，人只处理议价和交付，再按买家反馈迭代。 结果：曝光约 2.86 万 · 浏览 1670 · 想要 95 · 已服务 10+ 单 · 好评 100%","keys":["AI 工具服务：从上架到成交","获客转化","自动化交付","市场验证"]},{"id":"p-jp-finance-content","title":"日本金融内容运营","text":"日本金融内容运营：客户项目：IG / Facebook / X 三平台日更流水线。 问题：三个平台每天都要发金融观点和配图，纯人工难以持续。 做法：AI 生成观点与配图，人只在关键节点审核后发布。 结果：三平台日更运行中","keys":["日本金融内容运营","内容自动化","多平台","客户项目"]},{"id":"p-personal-db","title":"个人数据库与脱敏发布","text":"个人数据库与脱敏发布：资料按公开 / 私密分级管理，对外内容自动脱敏后才发布。 问题：资料越积越多，又要对外展示，最怕把不该公开的内容带出去。 做法：Markdown 为真相源，SQLite 全文索引可随时重建；按公开 / 私密分级导出，密钥不入库。 结果：这个网站的内容就从这里导出","keys":["个人数据库与脱敏发布","数据分级","脱敏","SQLite"]},{"id":"e-0","title":"独立执业 · AI 解决方案 · FDE","text":"2026.07 – 至今，独立执业，AI 解决方案 · FDE：给制造外贸企业做 AI 落地：需求澄清、现场面谈、知识库 MVP；付费客户 Skill 包交付，客户复购并追加新版本；自建多 Agent 调度中枢，强模型规划验收、便宜模型批量执行","keys":["独立执业","AI 解决方案 · FDE","经历","工作"]},{"id":"e-1","title":"华商律师事务所 · 执行主任助理 · 客户拓展与谈案","text":"约 6 个月，华商律师事务所，执行主任助理 · 客户拓展与谈案：业务拓展部创始成员：部门初创时只有我和执行主任（全所三位主任之一）两人，入职一周独立上岗；随执行主任上门谈案，常规每天 3 家，6 个月累计拜访 90+ 家客户，覆盖深圳、广州、佛山；线索来自律所沉淀客户、外购线索和网红律师合作引流，负责跟进、需求判断与签约转化","keys":["华商律师事务所","执行主任助理 · 客户拓展与谈案","经历","工作"]},{"id":"e-2","title":"国家统一法律职业资格考试 · 客观题已通过","text":"2026，国家统一法律职业资格考试，客观题已通过：主观题已考，待出分","keys":["国家统一法律职业资格考试","客观题已通过","经历","工作"]},{"id":"db-proj-attention","title":"个人注意力管理系统","text":"近一月实记 235.1🍅（法考 73.6% / AI 26.4%）；07-20 至 09-14 每日连续记录","keys":["个人注意力管理系统","数据"]},{"id":"db-proj-fde-enterprise","title":"企业 AI 上下文系统（FDE 实操）","text":"佛山制造/外贸企业，约 8 人团队；内容获客\n需求表 + 5 分钟电话澄清；需求收敛为「企业上下文 → 单点自动化 → 可复用 Skill」三步；2026-09-24 佛山南海现场面谈","keys":["企业 AI 上下文系统（FDE 实操）","客户","做了"]},{"id":"db-proj-jp-finance","title":"日本金融内容运营","text":"IG/FB/X 日更金融观点 + 配图，AI 生产流程；2026-10 起约 2 个月","keys":["日本金融内容运营","内容"]},{"id":"db-proj-tw-stock","title":"台股群聊剧本生成器","text":"投教社群运营方（老客户复购）\n2026-08-30 v1 Skill 包：规则层 + 5 场景卡 + 31 角色卡 + 抓取/自检脚本 + 客户自安装说明；09 月韩股版本对接\n单一事实源 trigger_map、环境层与生成层解耦、抓取失败不得编数","keys":["台股群聊剧本生成器","客户","交付","设计"]}],"api":"","email":"p971523047@gmail.com"}</script> <script type="module" src="/website/_astro/ask.astro_astro_type_script_index_0_lang.Cs463XgO.js"></script>  <footer class="foot" data-astro-cid-5hce7sga><div class="wrap" data-astro-cid-5hce7sga>© 2026 Helix · 深圳</div></footer>  </body></html>
